<template>
    <section class="fleet" aria-labelledby="fleet-heading">
        <h2 id="fleet-heading" class="slds-text-heading_medium slds-m-bottom_small">Find a car</h2>

        <div class="filters" role="search" aria-label="Vehicle search filters">
            <div class="filter-grid">
                <lightning-input
                    type="datetime"
                    label="Pickup date and time"
                    class="date-field"
                    name="pickupDateTime"
                    data-field="pickupDateTime"
                    data-validate
                    value={pickupDateTime}
                    timezone="Asia/Kolkata"
                    message-when-bad-input={dateBadInputMessage}
                    message-when-value-missing="Choose a pickup date and time."
                    onchange={handleFilterChange}
                    required
                ></lightning-input>
                <lightning-input
                    type="datetime"
                    label="Return date and time"
                    class="date-field"
                    name="returnDateTime"
                    data-field="returnDateTime"
                    data-validate
                    value={returnDateTime}
                    timezone="Asia/Kolkata"
                    message-when-bad-input={dateBadInputMessage}
                    message-when-value-missing="Choose a return date and time."
                    onchange={handleFilterChange}
                    required
                ></lightning-input>
                <lightning-combobox
                    label="City"
                    name="branchCity"
                    data-field="branchCity"
                    value={branchCity}
                    options={cityOptions}
                    onchange={handleFilterChange}
                ></lightning-combobox>
                <lightning-combobox
                    class={extraClass}
                    label="Category"
                    name="category"
                    data-field="category"
                    value={category}
                    options={categoryOptions}
                    onchange={handleFilterChange}
                ></lightning-combobox>
                <lightning-input
                    class={extraClass}
                    type="number"
                    label="Minimum seats"
                    name="seats"
                    data-field="seats"
                    data-validate
                    value={seats}
                    min="1"
                    max="9"
                    step="1"
                    message-when-bad-input="Enter seats as a whole number, e.g. 5."
                    message-when-range-underflow="Seats must be at least 1."
                    message-when-range-overflow="Our largest cars have 9 seats."
                    message-when-step-mismatch="Enter seats as a whole number, e.g. 5."
                    onchange={handleFilterChange}
                ></lightning-input>
                <lightning-combobox
                    class={extraClass}
                    label="Transmission"
                    name="transmission"
                    data-field="transmission"
                    value={transmission}
                    options={transmissionOptions}
                    onchange={handleFilterChange}
                ></lightning-combobox>
                <lightning-combobox
                    class={extraClass}
                    label="Fuel type"
                    name="fuelType"
                    data-field="fuelType"
                    value={fuelType}
                    options={fuelOptions}
                    onchange={handleFilterChange}
                ></lightning-combobox>
                <lightning-input
                    class={extraClass}
                    type="number"
                    label="Max price per day (INR)"
                    name="maxDailyRate"
                    data-field="maxDailyRate"
                    data-validate
                    value={maxDailyRate}
                    min="1"
                    step="1"
                    message-when-bad-input="Enter a price in rupees, e.g. 3000."
                    message-when-range-underflow="Max price must be more than ₹0."
                    message-when-step-mismatch="Enter a whole number of rupees, e.g. 3000."
                    formatter="decimal"
                    onchange={handleFilterChange}
                ></lightning-input>
            </div>

            <div class="more-toggle">
                <lightning-button
                    variant="base"
                    label={moreFiltersLabel}
                    icon-name={moreFiltersIcon}
                    aria-expanded={moreFiltersExpanded}
                    data-id="more-filters"
                    onclick={handleToggleMoreFilters}
                ></lightning-button>
            </div>

            <template lwc:if={dateError}>
                <p class="slds-text-color_error slds-m-top_x-small date-error" role="alert" data-id="date-error">
                    {dateError}
                </p>
            </template>
            <template lwc:if={filterError}>
                <p class="slds-text-color_error slds-m-top_x-small" role="alert" data-id="filter-error">{filterError}</p>
            </template>
            <template lwc:if={showDatePrompt}>
                <p class="slds-text-color_weak slds-m-top_x-small" data-id="date-prompt">
                    Pick your dates to see which cars are free.
                </p>
            </template>

            <div class="actions">
                <lightning-button
                    variant="brand"
                    label="Search"
                    data-id="search-button"
                    disabled={searchDisabled}
                    onclick={handleSearchClick}
                ></lightning-button>
                <lightning-button variant="neutral" label="Clear filters" onclick={handleReset}></lightning-button>
            </div>
        </div>

        <div class="results" aria-live="polite">
            <template lwc:if={isLoading}>
                <div class="spinner-holder">
                    <lightning-spinner alternative-text="Searching cars" size="medium"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error state" role="alert" data-id="error">
                    <span>{errorMessage}</span>
                </div>
            </template>

            <template lwc:if={showEmpty}>
                <div class="state empty" data-id="empty">
                    <lightning-icon icon-name="utility:search" size="small" alternative-text=""></lightning-icon>
                    <p>No cars free for these dates</p>
                </div>
            </template>

            <template lwc:if={hasResults}>
                <p class="slds-text-body_small slds-m-bottom_x-small count">{resultCountLabel}</p>
                <ul class="grid">
                    <template for:each={vehicles} for:item="vehicle">
                        <li key={vehicle.id} class="grid-item">
                            <c-vehicle-card
                                vehicle={vehicle}
                                total-price={vehicle.total}
                                days={vehicle.days}
                                onselect={handleVehicleSelect}
                            ></c-vehicle-card>
                        </li>
                    </template>
                </ul>
            </template>
        </div>
    </section>
</template>
